# Portfolio positions — weights only, safe to publish.
#
# The split is deliberate:
#   * this file      — tickers and percent-of-account weights. Committed, and
#                      what the published dashboard's Portfolio tab reads.
#   * holdings.local.yml — dollar values, cost basis, unrealized P/L. Gitignored.
#                      The repo is public and git history is permanent, so an
#                      account balance pushed once cannot be unpublished.
#
# Percentages describe allocation without disclosing size: 24% of an account
# means the same whether the account holds $8k or $8M.
#
# Source: Yahoo Finance → linked Fidelity Investments INDIVIDUAL account,
# read from the signed-in session on 2026-08-19. Yahoo exposes no API for a
# linked-brokerage portfolio, so refreshing this means re-reading that page.

